<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Painel de Metas COC Online">
  <rect width="512" height="512" rx="96" fill="#121211"/>
  <!-- A linha da meta. E o unico elemento colorido, entao e o que o olho acha
       primeiro, inclusive em 16px na aba do navegador. -->
  <rect x="104" y="226" width="304" height="38" rx="19" fill="#CFFF04"/>
  <!-- Duas barras, nao quatro. A versao anterior tinha quatro barras finas e uma
       delas era a lima: em 32px as barras emendavam e a lima sumia. Duas barras
       largas sobrevivem ao tamanho pequeno, e a alta rompendo a linha e a
       historia do painel inteiro. -->
  <rect x="104" y="300" width="118" height="108" rx="18" fill="#F4F2EC"/>
  <rect x="290" y="112" width="118" height="296" rx="18" fill="#F4F2EC"/>
</svg>
